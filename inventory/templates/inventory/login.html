<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StockPilot — Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, rgba(37, 99, 235, 0.18), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.15), transparent 30%),
                #050b14;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .background-grid {
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);

            background-size: 50px 50px;

            pointer-events: none;
        }

        .login-container {
            width: 100%;
            max-width: 430px;

            padding: 20px;

            position: relative;
            z-index: 2;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 58px;
            height: 58px;

            margin: 0 auto 15px;

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #7c3aed
            );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            box-shadow:
                0 15px 40px rgba(37, 99, 235, 0.35);
        }

        .logo-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .logo-subtitle {
            margin-top: 6px;

            color: #7f8da3;

            font-size: 13px;
        }

        .login-card {
            background: rgba(12, 20, 32, 0.88);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            padding: 34px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.45);
        }

        .welcome {
            margin-bottom: 28px;
        }

        .welcome h2 {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #8491a5;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 13px;

            font-weight: 500;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border-radius: 10px;

            border: 1px solid #243244;

            background: #0a1320;

            color: white;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        input::placeholder {
            color: #526174;
        }

        input:focus {
            border-color: #3b82f6;

            box-shadow:
                0 0 0 3px rgba(59,130,246,0.12);
        }

        .login-button {
            width: 100%;

            margin-top: 5px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #4f46e5
            );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

            box-shadow:
                0 10px 25px rgba(37,99,235,0.25);
        }

        .login-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 14px 30px rgba(37,99,235,0.35);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            display: none;

            margin-top: 16px;

            padding: 11px 12px;

            border-radius: 9px;

            background: rgba(239,68,68,0.10);

            border: 1px solid rgba(239,68,68,0.25);

            color: #fca5a5;

            font-size: 13px;

            line-height: 1.4;
        }

        .demo-info {
            margin-top: 22px;

            padding-top: 18px;

            border-top: 1px solid rgba(255,255,255,0.06);

            text-align: center;

            color: #64748b;

            font-size: 11px;
        }

        .demo-info strong {
            color: #94a3b8;
        }

        .footer {
            text-align: center;

            margin-top: 20px;

            color: #475569;

            font-size: 11px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-bottom: 7px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 8px rgba(34,197,94,0.7);
        }

        @media (max-width: 480px) {

            .login-card {
                padding: 27px 22px;
            }

            .logo-title {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="background-grid"></div>

<div class="login-container">

    <!-- LOGO -->

    <div class="logo-section">

        <div class="logo-icon">
            📦
        </div>

        <div class="logo-title">
            StockPilot
        </div>

        <div class="logo-subtitle">
            Inventory Intelligence Platform
        </div>

    </div>


    <!-- LOGIN CARD -->

    <div class="login-card">

        <div class="welcome">

            <h2>
                Welcome back
            </h2>

            <p>
                Sign in to manage your inventory,
                suppliers and purchase operations.
            </p>

        </div>


        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Sign in to StockPilot
            </button>

        </form>


        <div
            class="error-message"
            id="errorMessage"
        ></div>


        <!-- DEMO ACCOUNT -->

        <div class="demo-info">

            Demo account:
            <strong>demo</strong>
            /
            <strong>Demo@12345</strong>

        </div>

    </div>


    <div class="footer">

        <div class="status">

            <span class="status-dot"></span>

            StockPilot system operational

        </div>

        Inventory Management Platform

    </div>

</div>


<script>

    const loginForm =
        document.getElementById("loginForm");

    const loginButton =
        document.getElementById("loginButton");

    const errorMessage =
        document.getElementById("errorMessage");


    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();


        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        errorMessage.style.display = "none";


        loginButton.disabled = true;

        loginButton.textContent = "Signing in...";


        try {

            const response = await fetch("/api/login/", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })

            });


            const data = await response.json();


            if (!response.ok) {

                throw new Error(
                    data.detail ||
                    "Invalid username or password."
                );

            }


            /*
             * SAVE JWT TOKENS
             */

            if (data.access) {

                localStorage.setItem(
                    "access_token",
                    data.access
                );

            }


            if (data.refresh) {

                localStorage.setItem(
                    "refresh_token",
                    data.refresh
                );

            }


            /*
             * REDIRECT TO DASHBOARD
             */

            window.location.href = "/dashboard/";


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            errorMessage.textContent =
                error.message ||
                "Unable to login. Please try again.";


            errorMessage.style.display =
                "block";


            loginButton.disabled = false;

            loginButton.textContent =
                "Sign in to StockPilot";

        }

    });

</script>

</body>
</html>
